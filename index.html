<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOU! Ultimate Edition V2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK (Compat v9+) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #05070a; 
            margin: 0; 
            color: white; 
            overflow-x: hidden; 
        }
        .glass { 
            background: rgba(15, 18, 26, 0.8); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .btn-blue {
            background: #3b82f6;
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
        }
        .btn-purple {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            box-shadow: 0 4px 14px 0 rgba(168, 85, 247, 0.3);
        }
        .gradient-text { 
            background: linear-gradient(to right, #f97316, #fbbf24, #3b82f6); 
            -webkit-background-clip: text; 
            color: transparent; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 已寫入截圖 182644.png 中的配置 ---
        const firebaseConfig = {
            apiKey: "AIzaSyCKXqz3brBdTB0eKumon3D_nymr_cUKg_M",
            authDomain: "heyyou-5e8a2.firebaseapp.com",
            projectId: "heyyou-5e8a2",
            storageBucket: "heyyou-5e8a2.firebasestorage.app",
            messagingSenderId: "518500342518",
            appId: "1:518500342518:web:7385d55ab489f18d286ad7",
            measurementId: "G-4FRPL7XBXC"
        };

        // 初始化 Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        function App() {
            const [playerName, setPlayerName] = useState('7777');
            const [rooms, setRooms] = useState([]);
            const [currentRoom, setCurrentRoom] = useState(null);
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            // 認證
            useEffect(() => {
                auth.signInAnonymously().then(res => setUser(res.user));
            }, []);

            // 監聽房間列表
            useEffect(() => {
                if (!user) return;
                const unsubscribe = db.collection('nou_rooms')
                    .orderBy('createdAt', 'desc')
                    .limit(10)
                    .onSnapshot(snapshot => {
                        setRooms(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                        setLoading(false);
                    });
                return () => unsubscribe();
            }, [user]);

            const createRoom = async () => {
                const roomName = prompt("房間名稱:", `${playerName} 的遊戲`);
                if (!roomName) return;
                const newRoom = {
                    name: roomName,
                    host: playerName,
                    players: [{ id: user.uid, name: playerName }],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                const doc = await db.collection('nou_rooms').add(newRoom);
                setCurrentRoom({ id: doc.id, ...newRoom });
            };

            const joinRoom = async (room) => {
                if (room.players.length >= 4) return alert("房間已滿");
                const updatedPlayers = [...room.players, { id: user.uid, name: playerName }];
                await db.collection('nou_rooms').doc(room.id).update({ players: updatedPlayers });
                setCurrentRoom({ ...room, players: updatedPlayers });
            };

            if (currentRoom) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#05070a] p-6">
                        <div className="glass p-10 rounded-[40px] w-full max-w-lg text-center">
                            <h2 className="text-3xl font-black mb-6 italic">{currentRoom.name}</h2>
                            <div className="space-y-3 mb-10 text-left">
                                {currentRoom.players.map((p, i) => (
                                    <div key={i} className="bg-white/5 p-4 rounded-2xl flex justify-between items-center border border-white/5">
                                        <span className="font-bold">{p.name}</span>
                                        <span className="text-[10px] uppercase tracking-tighter opacity-50 px-3 py-1 bg-white/10 rounded-full">
                                            {i === 0 ? 'HOST' : `PLAYER ${i+1}`}
                                        </span>
                                    </div>
                                ))}
                            </div>
                            <button onClick={() => setCurrentRoom(null)} className="text-gray-500 hover:text-white transition-colors text-sm font-bold uppercase tracking-widest">
                                離開房間
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-[#05070a]">
                    <div className="text-center mb-16">
                        <h1 className="text-8xl font-black italic tracking-tighter gradient-text">NOU!</h1>
                        <p className="text-[10px] tracking-[0.4em] text-gray-500 uppercase mt-4 font-bold">Ultimate Edition V2.0</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-10 w-full max-w-6xl">
                        {/* 左側：連線對戰 (參考 175940.png) */}
                        <div className="glass rounded-[40px] p-10 relative overflow-hidden flex flex-col h-full">
                            <div className="flex items-center gap-3 mb-8">
                                <div className="w-1.5 h-6 bg-blue-500 rounded-full"></div>
                                <h2 className="text-2xl font-bold italic">連線對戰</h2>
                                <div className="ml-auto opacity-10">
                                    <svg width="60" height="60" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                                </div>
                            </div>

                            <div className="space-y-6 mb-10">
                                <div>
                                    <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-3">Player Identity</label>
                                    <input 
                                        type="text" 
                                        value={playerName}
                                        onChange={(e) => setPlayerName(e.target.value)}
                                        className="w-full bg-black/40 border border-white/10 rounded-2xl px-6 py-4 focus:outline-none focus:border-blue-500/50 transition-all font-bold"
                                    />
                                </div>
                                <button onClick={createRoom} className="w-full btn-blue py-5 rounded-2xl font-black italic tracking-wider transition-transform active:scale-95">
                                    建立新房間 +
                                </button>
                            </div>

                            <div className="flex-1">
                                <div className="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-4">公開大廳</div>
                                <div className="space-y-3">
                                    {loading ? (
                                        <div className="py-10 text-center opacity-30 italic">讀取中...</div>
                                    ) : rooms.length === 0 ? (
                                        <div className="py-10 text-center text-sm opacity-30 italic font-bold">目前大廳暫無公開房間</div>
                                    ) : (
                                        rooms.map(r => (
                                            <div key={r.id} className="flex items-center justify-between bg-white/5 border border-white/5 p-5 rounded-2xl">
                                                <div>
                                                    <div className="font-bold">{r.name}</div>
                                                    <div className="text-[10px] text-gray-500 uppercase">Host: {r.host} • {r.players.length}/4</div>
                                                </div>
                                                <button onClick={() => joinRoom(r)} className="px-6 py-2 btn-blue rounded-xl text-sm font-bold italic">加入</button>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* 右側：單機練習 (參考 175940.png) */}
                        <div className="glass rounded-[40px] p-10 flex flex-col items-center justify-center relative opacity-50">
                             <div className="absolute top-10 left-10 flex items-center gap-3">
                                <div className="w-1.5 h-6 bg-purple-500 rounded-full"></div>
                                <h2 className="text-2xl font-bold italic">單機練習</h2>
                            </div>
                            
                            <div className="flex bg-black/40 p-1 rounded-2xl mb-12 w-full max-w-xs">
                                {['簡單', '普通', '困難'].map(lv => (
                                    <button key={lv} className={`flex-1 py-3 rounded-xl text-xs font-bold ${lv==='普通'?'bg-purple-600 shadow-lg shadow-purple-500/30':'text-gray-600'}`}>{lv}</button>
                                ))}
                            </div>

                            <div className="w-full space-y-4">
                                <button className="w-full bg-white/5 border border-white/10 py-6 rounded-3xl font-black italic flex items-center justify-center gap-2">
                                    1 VS 1 ⚡
                                </button>
                                <button className="w-full btn-purple py-6 rounded-3xl font-black italic">
                                    1 VS 3 亂鬥
                                </button>
                            </div>
                            <div className="text-[10px] text-gray-700 font-bold uppercase tracking-widest mt-6">AI Powered Opponents</div>
                        </div>
                    </div>

                    <footer className="mt-20 text-[10px] font-bold text-gray-700 tracking-[0.3em] uppercase">
                        Designed for GitHub & Vercel Deployment
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
